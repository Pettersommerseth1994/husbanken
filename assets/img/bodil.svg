<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" width="140" height="100" role="img" aria-labelledby="bodil-tittel">
  <title id="bodil-tittel">Bodil, veilederen din i Husbanken</title>

  <defs>
    <!-- Alt av figuren klippes til den grønne flaten, slik at
         skuldrene møter rammen i stedet for å stikke utenfor. -->
    <clipPath id="bodil-flate">
      <path d="M70 5c22 0 38 1 48 6 11 6 16 17 16 33 0 18-4 31-13 39-9 8-26 12-51 12s-42-4-51-12C10 75 6 62 6 44 6 28 11 17 22 11 32 6 48 5 70 5Z"/>
    </clipPath>
  </defs>

  <!-- Grønn flate -->
  <path d="M70 5c22 0 38 1 48 6 11 6 16 17 16 33 0 18-4 31-13 39-9 8-26 12-51 12s-42-4-51-12C10 75 6 62 6 44 6 28 11 17 22 11 32 6 48 5 70 5Z"
        fill="#D9E8C5" stroke="#73A54B" stroke-width="3"/>

  <g clip-path="url(#bodil-flate)">

    <!-- Hår, bakre masse. Rekker ned til skuldrene på begge sider. -->
    <path d="M70 12c14 0 23 10 23 26 0 12-1 21-2 29-1 4-3 6-6 5-3-1-4-4-4-8V42H59v22c0 4-1 7-4 8-3 1-5-1-6-5-1-8-2-17-2-29 0-16 9-26 23-26Z"
          fill="#16240D"/>

    <!-- Kropp. Skuldrene møter bunnen av flaten. -->
    <path d="M70 62c17 0 28 11 31 26 1 4 1 8 1 12H38c0-4 0-8 1-12 3-15 14-26 31-26Z"
          fill="#ffffff" stroke="#2C4656" stroke-width="3" stroke-linejoin="round"/>

    <!-- Ansikt -->
    <path d="M70 20c10 0 16 7 16 19s-7 21-16 21-16-9-16-21 6-19 16-19Z"
          fill="#ffffff" stroke="#2C4656" stroke-width="3"/>

    <!-- Pannelugg -->
    <path d="M53 35c0-13 7-20 17-20s17 7 17 20c-3-8-9-12-17-12s-14 4-17 12Z" fill="#16240D"/>

    <!-- Hår, fremre lokker langs kinnene -->
    <path d="M53 28c-3 12-3 25-1 36 1 5-2 8-5 7-3-1-4-5-4-11 0-14 3-27 10-32Z" fill="#16240D"/>
    <path d="M87 28c3 12 3 25 1 36-1 5 2 8 5 7 3-1 4-5 4-11 0-14-3-27-10-32Z" fill="#16240D"/>

    <!-- Ansiktstrekk -->
    <circle cx="63.5" cy="39" r="2.2" fill="#2C4656"/>
    <circle cx="76.5" cy="39" r="2.2" fill="#2C4656"/>
    <path d="M65.5 47c2.2 2.2 6.8 2.2 9 0" stroke="#2C4656" stroke-width="2.6" stroke-linecap="round" fill="none"/>

    <!-- Lite blad på brystet, samme grønt som rammen -->
    <path d="M86 86c0-4 3-7 8-7 0 4-4 7-8 7Z" fill="#73A54B"/>
    <path d="M86 86c0-4-3-7-8-7 0 4 4 7 8 7Z" fill="#96C36E"/>
    <path d="M86 86v6" stroke="#4A7729" stroke-width="1.6" stroke-linecap="round"/>

  </g>
</svg>
